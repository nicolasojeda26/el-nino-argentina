name: Actualizar datos ONI (NOAA)

on:
  schedule:
    # Todos los lunes y jueves a las 12:00 UTC
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-oni:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Descargar último ONI de NOAA
        run: node scripts/update-oni.mjs

      - name: Commit y push si hay nuevos datos
        run: |
          if [[ -n "$(git status --porcelain src/data/oni.ascii.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/oni.ascii.txt
            git commit -m "chore(data): actualizar serie ONI desde NOAA"
            git push
          else
            echo "No hay cambios en oni.ascii.txt"
          fi

name: Actualizar alertas (SMN e INA)

on:
  schedule:
    # Cada 30 minutos
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Descargar alertas de SMN e INA
        run: node scripts/update-alertas.mjs

      - name: Commit y push si hay novedades
        run: |
          if [[ -n "$(git status --porcelain src/data/alertas.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/alertas.json
            git commit -m "chore(data): actualizar alertas SMN/INA"
            git push
          else
            echo "Sin cambios en alertas.json"
          fi
